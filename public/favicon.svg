<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D57B"/>
      <stop offset="100%" stop-color="#D4A843"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Git branch icon -->
  <g fill="#1A1E26" stroke="#1A1E26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main branch (vertical) -->
    <line x1="24" y1="18" x2="24" y2="46" stroke-width="4.5"/>
    <!-- Feature branch (curved into main) -->
    <path d="M40 18 C40 30 24 34 24 42" fill="none" stroke-width="4.5"/>
    <!-- Commits (nodes) -->
    <circle cx="24" cy="18" r="6.5"/>
    <circle cx="40" cy="18" r="6.5"/>
    <circle cx="24" cy="46" r="6.5"/>
  </g>
</svg>
